# DATASOURCE
spring.datasource.url=jdbc:postgresql://localhost:5432/springapi_ferias
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA, SQL
# "update": cria/ajusta as tabelas com base nas entidades, sem apagar dados existentes.
# Nunca use "create" ou "create-drop" aqui - isso apagaria o banco a cada restart.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (mesma logica de variavel de ambiente do perfil test)
jwt.secret=${JWT_SECRET:MinhaChaveSecretaSuperSeguraParaAssinarTokensJWT2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# LOGIN
# Em dev o login e por email e senha (nao existe o gateway do portal aqui
# para entregar a identidade da conta DB1).
app.auth.senha-habilitada=true
# Para testar o login pela conta DB1 localmente, mude para true e mande os
# headers X-DB1-Oid, X-DB1-Email e X-DB1-Name pelo Postman no GET /api/auth/sso.
# NUNCA ligue isso num servidor sem o gateway do portal na frente.
app.auth.sso-habilitado=false
