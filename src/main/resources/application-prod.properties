# DATASOURCE
# Nao declare spring.datasource.* aqui: desde 25/09/2026 o Portal de Deploy DB1
# detecta o driver org.postgresql:postgresql no pom.xml e injeta sozinho as
# variaveis SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD no container.
# O Spring Boot le essas variaveis de ambiente automaticamente (relaxed
# binding), sem precisar de nenhuma linha aqui. Declarar manualmente faria o
# portal pensar que ja existe um banco externo configurado e pular o
# provisionamento automatico.

# JPA, SQL
# "update": cria/ajusta as tabelas com base nas entidades, sem apagar dados existentes.
# Tolerado com ressalva (nao remove coluna/tabela obsoleta) - o ideal a longo
# prazo seria migrar para Flyway/Liquibase, mas fica fora de escopo por agora.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# PROXY REVERSO
# O portal termina o HTTPS na frente do container e repassa a requisicao em
# HTTP para a porta interna. Com isso o Spring passa a respeitar os headers
# X-Forwarded-* e enxerga a URL real (https://springapi-ferias.apps.db1group.com).
server.forward-headers-strategy=framework

# CORS
# Origens liberadas em producao (separadas por virgula). Pode ser sobrescrito
# pela variavel de ambiente CORS_ALLOWED_ORIGINS sem precisar recompilar.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://springapi-ferias.apps.db1group.com,http://springapi-ferias.apps.db1group.com}

# LOGIN
# Em producao todo mundo entra pela conta Microsoft da DB1: o gateway do
# portal faz o login e entrega a identidade nos headers X-DB1-*. O login por
# senha fica desligado (sem senha, sem recuperacao de senha pra manter).
app.auth.sso-habilitado=true
app.auth.senha-habilitada=false
