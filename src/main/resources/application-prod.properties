# DATASOURCE
# Nao declare spring.datasource.* aqui: desde 25/09/2026 o Portal de Deploy DB1
# detecta o driver org.postgresql:postgresql no pom.xml e injeta sozinho as
# variaveis SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD no container.
# O Spring Boot le essas variaveis de ambiente automaticamente (relaxed
# binding), sem precisar de nenhuma linha aqui. Declarar manualmente faria o
# portal pensar que ja existe um banco externo configurado e pular o
# provisionamento automatico.

# JPA, SQL
# "update": cria/ajusta as tabelas com base nas entidades, sem apagar dados existentes.
# Tolerado com ressalva (nao remove coluna/tabela obsoleta) - o ideal a longo
# prazo seria migrar para Flyway/Liquibase, mas fica fora de escopo por agora.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}