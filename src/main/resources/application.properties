spring.application.name=springapi-ferias

# Perfil padrao (IntelliJ). No Portal de Deploy o Dockerfile forca "prod"
# com -Dspring.profiles.active=prod, que vence esta linha.
spring.profiles.active=dev

spring.jpa.open-in-view=true

# Le o arquivo .env da pasta onde o app roda (no container: /app/.env).
# O portal NAO transforma o .env do zip em variaveis de ambiente do container,
# entao sem esta linha o JWT_SECRET do .env nunca chegaria no Spring.
# "optional:" = se o arquivo nao existir (ex.: no IntelliJ), segue sem erro.
# Atencao: as chaves sao lidas literalmente (JWT_SECRET continua JWT_SECRET),
# por isso o application-prod.properties usa ${JWT_SECRET}.
spring.config.import=optional:file:.env[.properties]